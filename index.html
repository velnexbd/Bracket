<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tournament Bracket</title>
<style>
  :root {
    --bg: #f3f5f7;
    --ink: #14213d;
    --muted: #5b6678;
    --accent: #1f6feb;
    --panel: #ffffff;
    --line: #d9dee5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1522;
      --ink: #eef2f8;
      --muted: #9aa6b8;
      --accent: #3bff93;
      --panel: #00391a;
      --line: #355338;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Trebuchet MS", "Segoe UI", Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }
  header {
    max-width: 1200px;
    margin: 0 auto;
    padding: 40px 20px 16px;
  }
  h1 {
    margin: 0;
    font-size: clamp(2rem, 5vw, 3.2rem);
    letter-spacing: -0.02em;
    border-left: 6px solid var(--accent);
    padding-left: 14px;
  }
  header p {
    margin: 10px 0 0 20px;
    color: var(--muted);
  }
  main {
    max-width: 1200px;
    margin: 0 auto;
    padding: 12px 20px 48px;
  }
  .frame {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px;
    overflow: hidden;
  }
  iframe { display: block; width: 100%; border: 0; }
  .note { margin-top: 12px; font-size: .9rem; color: var(--muted); }
  .note a { color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>Tournament Bracket</h1>
  <p>Follow the matches and see who advances.</p>
</header>
<main>
  <div class="frame">
    <iframe src="https://challonge.com/odpgpcwr/module" width="100%" height="700" frameborder="0" scrolling="auto" allowtransparency="true"></iframe>
  </div>
  <p class="note">Bracket not showing? <a href="https://brackethq.com/b/jq5od/" target="_blank" rel="noopener">Open it on BracketHQ</a>.</p>
</main>
</body>
</html>
